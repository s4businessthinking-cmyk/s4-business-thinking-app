name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build
        env:
          EP_PUBLISH: never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-android:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: cmd
        run: |
          call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo y| call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --licenses

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run android:build
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APK_DIR="android/app/build/outputs/apk/release"
          APK_SRC="${APK_DIR}/app-release.apk"

          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="${APK_DIR}/app-release-unsigned.apk"
          fi

          if [ ! -f "$APK_SRC" ]; then
            echo "APK not found in ${APK_DIR}"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          cp "$APK_SRC" "S4-Business-Thinking-${VERSION}.apk"
          ls -la "S4-Business-Thinking-${VERSION}.apk"

      - name: Upload Android artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: S4-Business-Thinking-*.apk

  publish:
    needs: [build-windows, build-android]
    if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Android artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

          echo "Files to publish:"
          find release-files -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: S4 Business Thinking ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
          make_latest: true
          files: release-files/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
