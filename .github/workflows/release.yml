name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build
        env:
          EP_PUBLISH: never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: cmd
        run: |
          call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo y| call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --licenses

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android debug keystore
        shell: cmd
        run: node scripts/ensure-android-keystore.cjs

      - name: Build Android APK
        run: npm run android:build
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Resolve release version
        id: apkmeta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: List APK outputs
        if: success()
        shell: cmd
        run: |
          dir /s /b android\app\build\outputs\apk\release\*.apk

      - name: Prepare APK
        if: success()
        shell: cmd
        env:
          VERSION: ${{ steps.apkmeta.outputs.version }}
        run: |
          set APK_SRC=android\app\build\outputs\apk\release\app-release.apk
          if not exist "%APK_SRC%" (
            echo Signed release APK not found: %APK_SRC%
            dir android\app\build\outputs\apk\release
            exit /b 1
          )

          copy /Y "%APK_SRC%" "S4-Business-Thinking-%VERSION%.apk"
          dir "S4-Business-Thinking-%VERSION%.apk"

      - name: Verify APK signature
        if: success()
        shell: cmd
        env:
          VERSION: ${{ steps.apkmeta.outputs.version }}
        run: |
          call "%ANDROID_SDK_ROOT%\build-tools\36.0.0\apksigner.bat" verify --print-certs "S4-Business-Thinking-%VERSION%.apk"
          if errorlevel 1 exit /b 1

      - name: Upload Android artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            S4-Business-Thinking-*.apk
            S4-Business-Thinking-*-bundle.zip

  publish:
    needs: [build-windows, build-android]
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

          echo "Files to publish:"
          find release-files -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: S4 Business Thinking ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
          make_latest: true
          files: release-files/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
