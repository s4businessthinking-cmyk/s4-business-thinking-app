name: Upload Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: cmd
        run: |
          call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo y| call "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --licenses

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:android-web

      - name: Sync Android assets
        run: node scripts/sync-android-assets.cjs

      - name: Write Android local.properties
        shell: pwsh
        run: node scripts/prepare-android-local-props.cjs
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Assemble Android release APK
        run: node scripts/run-android-gradle.cjs assembleRelease --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APK_DIR="android/app/build/outputs/apk/release"
          APK_SRC="${APK_DIR}/app-release.apk"

          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="${APK_DIR}/app-release-unsigned.apk"
          fi

          if [ ! -f "$APK_SRC" ]; then
            echo "APK not found in ${APK_DIR}"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          APK_NAME="S4-Business-Thinking-${VERSION}.apk"
          cp "$APK_SRC" "$APK_NAME"
          ls -la "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.apk_name }}
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
