services:
  s4erp:
    build:
      context: ..
      dockerfile: erp-server/Dockerfile
    container_name: s4erp
    restart: unless-stopped
    network_mode: host
    env_file: .env
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
