# S4 ERP reverse proxy (STAGE 15 §16.5/§16.7).
# HTTP (:80) proxies to Gunicorn (web) and Daphne (ws). Enable the HTTPS server
# block after placing certs in ./nginx/certs (fullchain.pem + privkey.pem).

upstream s4_web {
    server web:8000;
}

upstream s4_ws {
    server ws:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # WebSocket (realtime consumer) -> Daphne
    location /ws/ {
        proxy_pass http://s4_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Collected static assets served directly by nginx.
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Everything else -> Gunicorn (web)
    location / {
        proxy_pass http://s4_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

