# S4 ERP — Single-VPS production stack (STAGE 15 §16.5).
# Identical image for web/ws/worker/beat; only the command + role differ (§16.6).
#   Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env file (copy from .env.example and set real secrets).

x-django-image: &django-image
  build:
    context: ../../
    dockerfile: infrastructure/docker/Dockerfile.django.prod
  image: s4-erp-django:prod
  restart: unless-stopped
  env_file:
    - .env
  environment: &django-env
    DJANGO_SETTINGS_MODULE: config.settings.production
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    ERP_BUILD_STATE_PATH: /app/erp/build-state.json
    ERP_BACKUP_ROOT: /app/backend/django_app/backups
    ERP_MEDIA_ROOT: /app/backend/django_app/media
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
  volumes:
    - s4_erp_media:/app/backend/django_app/media
    - s4_erp_backups:/app/backend/django_app/backups
    - s4_erp_static:/app/backend/django_app/staticfiles

services:
  postgres:
    image: postgres:16-alpine
    container_name: s4-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s4_erp}
      POSTGRES_USER: ${POSTGRES_USER:-s4_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - s4_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-s4_erp} -d ${POSTGRES_DB:-s4_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: s4-erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - s4_erp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: s4-erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-s4admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - s4_erp_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    <<: *django-image
    container_name: s4-erp-web
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
    command: ["gunicorn", "-c", "/app/gunicorn.conf.py", "config.wsgi:application"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ws:
    <<: *django-image
    container_name: s4-erp-ws
    command: ["daphne", "-b", "0.0.0.0", "-p", "9000", "config.asgi:application"]
    depends_on:
      web:
        condition: service_healthy

  worker:
    <<: *django-image
    container_name: s4-erp-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *django-image
    container_name: s4-erp-beat
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: s4-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - s4_erp_static:/var/www/static:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      ws:
        condition: service_started

volumes:
  s4_erp_pgdata:
  s4_erp_redis:
  s4_erp_minio:
  s4_erp_media:
  s4_erp_backups:
  s4_erp_static:
